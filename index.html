<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えいご ディクテーション</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#2b3a55; --sub:#7688a8;
    --brand:#4f8cff; --brand-d:#2f6ae0; --good:#27c08a; --bad:#ff5d6c;
    --warn:#ffb020; --gold:#ffcf3f; --soft:#eef3fb; --line:#e3eaf5;
    --shadow:0 6px 20px rgba(60,90,150,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:linear-gradient(180deg,#eaf1ff,#f4f7fb 240px);
    color:var(--ink);min-height:100vh;padding:14px;
    max-width:640px;margin:0 auto;
  }
  h1{font-size:20px;margin:0;letter-spacing:.5px}
  .muted{color:var(--sub)}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:700}
  button:active{transform:translateY(1px)}
  .row{display:flex;gap:10px;align-items:center}
  .wrap{flex-wrap:wrap}
  .grow{flex:1}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:2px 4px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .emoji{font-size:26px}
  .streak-chip{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}

  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:12px;background:#e7eefc;color:var(--sub);font-size:15px;transition:.15s}
  .tabs button.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,140,255,.4)}

  /* mode switch */
  .seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;background:transparent;color:var(--sub);font-size:14px;border-radius:11px}
  .seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 8px rgba(60,90,150,.12)}

  /* practice */
  .prompt-jp{font-size:15px;color:var(--sub);margin:4px 0 14px;text-align:center;min-height:20px}
  .play-area{display:flex;flex-direction:column;align-items:center;gap:12px;margin:8px 0 18px}
  .play-btn{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fa6ff,#2f6ae0);
    color:#fff;font-size:38px;box-shadow:0 8px 22px rgba(47,106,224,.45);display:flex;align-items:center;justify-content:center}
  .play-btn.speaking{animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,106,224,.45)}70%{box-shadow:0 0 0 16px rgba(47,106,224,0)}100%{box-shadow:0 0 0 0 rgba(47,106,224,0)}}
  .speed{width:100%;max-width:320px}
  .speed label{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--brand)}

  .answer-input{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:14px;
    text-align:center;outline:none;transition:.15s;letter-spacing:1px}
  .answer-input:focus{border-color:var(--brand)}

  .hintbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .ghost{background:var(--soft);color:var(--brand-d);padding:9px 14px;font-size:13px;border-radius:12px}
  .hint-box{text-align:center;font-size:18px;letter-spacing:6px;color:var(--sub);min-height:24px;font-weight:800}
  .primary{background:var(--brand);color:#fff;padding:15px;font-size:17px;width:100%;box-shadow:0 5px 14px rgba(79,140,255,.4)}
  .next-btn{background:var(--good);color:#fff;padding:15px;font-size:17px;width:100%;box-shadow:0 5px 14px rgba(39,192,138,.4)}

  /* result */
  .result{margin-top:14px;text-align:center}
  .verdict{font-size:24px;font-weight:900;margin-bottom:8px}
  .verdict.ok{color:var(--good)}
  .verdict.ng{color:var(--bad)}
  .diff{font-size:24px;font-weight:800;letter-spacing:2px;word-break:break-word;line-height:1.5}
  .diff .c-ok{color:var(--good)}
  .diff .c-ng{color:var(--bad);text-decoration:underline wavy var(--bad)}
  .diff .c-miss{color:var(--bad);opacity:.5}
  .correct-line{font-size:18px;margin-top:6px}
  .correct-line b{color:var(--brand-d)}
  .meaning{color:var(--sub);font-size:15px;margin-top:4px}
  .stars{color:var(--gold);font-size:20px;letter-spacing:2px;margin-top:6px}

  /* stats strip */
  .stats3{display:flex;gap:10px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:22px;font-weight:900;color:var(--brand-d)}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}

  /* goal */
  .goal{display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ffb020);border-radius:999px;transition:width .4s}
  .goal .gtxt{font-size:13px;font-weight:800;color:var(--warn);white-space:nowrap}

  /* dot grid */
  .grid{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin-top:8px}
  .dot{aspect-ratio:1;border-radius:50%;background:#e3eaf5}
  .dot.l1{background:#c9def7}.dot.l2{background:#8ec0f5}.dot.l3{background:#4f8cff}.dot.l4{background:#2f6ae0}.dot.l5{background:#ffcf3f}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:10px;align-items:center}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:middle}

  /* badges */
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .badge{flex:0 0 auto;width:72px;text-align:center;opacity:.35;transition:.2s}
  .badge.got{opacity:1}
  .badge .ico{font-size:30px;filter:grayscale(1)}
  .badge.got .ico{filter:none}
  .badge .bn{font-size:10px;color:var(--sub);margin-top:2px;line-height:1.2}

  /* collection list */
  .collect{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;max-height:50vh;overflow:auto}
  .word-card{background:var(--soft);border-radius:12px;padding:8px 10px}
  .word-card .w{font-weight:800;font-size:15px}
  .word-card .m{font-size:12px;color:var(--sub)}
  .word-card .s{color:var(--gold);font-size:13px;letter-spacing:1px}
  .word-card.new{opacity:.45}

  .section-title{font-weight:800;font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .pop{position:fixed;font-size:28px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:60}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.4)}}
  .hidden{display:none!important}
  .center{text-align:center}
  .small{font-size:12px}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="emoji">📣</span><div><h1>えいご きいて かこう</h1><div class="muted small">ディクテーション れんしゅう</div></div></div>
  <div class="streak-chip">🔥 <span id="streakNum">0</span>日</div>
</header>

<div class="tabs">
  <button id="tabPractice" class="on" onclick="showTab('practice')">✏️ れんしゅう</button>
  <button id="tabCollect" onclick="showTab('collect')">🏆 コレクション</button>
</div>

<!-- ============ PRACTICE ============ -->
<div id="view-practice">

  <!-- daily goal -->
  <div class="card">
    <div class="goal">
      <span style="font-size:20px">🎯</span>
      <div class="bar"><i id="goalBar" style="width:0%"></i></div>
      <span class="gtxt" id="goalTxt">0 / 10</span>
    </div>
  </div>

  <!-- mode -->
  <div class="card">
    <div class="seg">
      <button id="modeWord" class="on" onclick="setMode('word')">📝 たんご</button>
      <button id="modeSent" onclick="setMode('sentence')">💬 たんぶん</button>
    </div>
  </div>

  <!-- player + input -->
  <div class="card">
    <div class="prompt-jp" id="promptJp">きいて かいてみよう！</div>
    <div class="play-area">
      <button class="play-btn" id="playBtn" onclick="speakCurrent()">🔊</button>
      <div class="small muted">きく</div>
      <div class="speed">
        <label><span>ゆっくり</span><span id="speedVal">ふつう (1.0x)</span><span>はやい</span></label>
        <input type="range" id="speed" min="0.5" max="1.25" step="0.05" value="1">
      </div>
    </div>

    <input class="answer-input" id="answer" type="text" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" placeholder="ここに 英語を かいてね">

    <div class="hintbar">
      <button class="ghost" onclick="hintCount()">🔢 もじすう</button>
      <button class="ghost" onclick="hintFirst()">🅰️ さいしょの1もじ</button>
      <button class="ghost" onclick="showAnswer()">👀 こたえを見る</button>
    </div>
    <div class="hint-box" id="hintBox"></div>

    <button class="primary" id="checkBtn" onclick="checkAnswer()">こたえあわせ</button>
    <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">つぎへ ▶</button>

    <div class="result hidden" id="result"></div>
  </div>
</div>

<!-- ============ COLLECTION ============ -->
<div id="view-collect" class="hidden">

  <div class="stats3">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">のべ もんだい</div></div>
    <div class="stat"><div class="n" id="stAcc">0%</div><div class="l">せいかいりつ</div></div>
    <div class="stat"><div class="n" id="stDays">0</div><div class="l">がくしゅう日</div></div>
  </div>

  <div class="card">
    <div class="section-title">⭐ ポイント &amp; れんぞく</div>
    <div class="row wrap">
      <div class="stat" style="flex:1"><div class="n" id="stPts">0</div><div class="l">ポイント</div></div>
      <div class="stat" style="flex:1"><div class="n">🔥 <span id="stStreak">0</span></div><div class="l">れんぞく日</div></div>
      <div class="stat" style="flex:1"><div class="n">🏆 <span id="stBest">0</span></div><div class="l">さいこう れんぞく</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🏅 バッジ</div>
    <div class="badges" id="badges"></div>
  </div>

  <div class="card">
    <div class="section-title">🟦 がんばった ドット</div>
    <div class="muted small">こたえあわせ するたびに ふえるよ（1マス＝1もん）</div>
    <div class="grid" id="dotGrid"></div>
    <div class="legend">
      <span><i style="background:#e3eaf5"></i>これから</span>
      <span><i style="background:#c9def7"></i>★1</span>
      <span><i style="background:#8ec0f5"></i>★2</span>
      <span><i style="background:#4f8cff"></i>★3</span>
      <span><i style="background:#2f6ae0"></i>★4</span>
      <span><i style="background:#ffcf3f"></i>★5 マスター</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">📚 ことばコレクション <span class="muted small" id="collProg"></span></div>
    <div class="seg" style="margin-bottom:8px">
      <button id="cwWord" class="on" onclick="setCollMode('word')">たんご</button>
      <button id="cwSent" onclick="setCollMode('sentence')">たんぶん</button>
    </div>
    <div class="collect" id="collectList"></div>
  </div>

  <div class="center small muted" style="margin:14px 0">
    <button class="ghost" onclick="resetAll()">きろくを ぜんぶ けす</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
const WORDS = [
  ["apple","りんご"],["banana","バナナ"],["orange","オレンジ"],["dog","いぬ"],["cat","ねこ"],
  ["bird","とり"],["fish","さかな"],["rabbit","うさぎ"],["book","ほん"],["pen","ペン"],
  ["pencil","えんぴつ"],["desk","つくえ"],["chair","いす"],["bag","かばん"],["notebook","ノート"],
  ["school","がっこう"],["teacher","せんせい"],["student","せいと"],["friend","ともだち"],["family","かぞく"],
  ["mother","おかあさん"],["father","おとうさん"],["sister","しまい"],["brother","きょうだい"],["baby","あかちゃん"],
  ["water","みず"],["milk","ぎゅうにゅう"],["juice","ジュース"],["bread","パン"],["rice","ごはん"],
  ["egg","たまご"],["meat","にく"],["lunch","ひるごはん"],["dinner","ゆうごはん"],["breakfast","あさごはん"],
  ["red","あか"],["blue","あお"],["green","みどり"],["yellow","きいろ"],["white","しろ"],
  ["black","くろ"],["pink","ピンク"],["brown","ちゃいろ"],["color","いろ"],["big","おおきい"],
  ["small","ちいさい"],["long","ながい"],["short","みじかい"],["new","あたらしい"],["old","ふるい"],
  ["happy","うれしい"],["sad","かなしい"],["good","よい"],["bad","わるい"],["fun","たのしい"],
  ["one","1"],["two","2"],["three","3"],["four","4"],["five","5"],
  ["six","6"],["seven","7"],["eight","8"],["nine","9"],["ten","10"],
  ["Monday","げつようび"],["Tuesday","かようび"],["Wednesday","すいようび"],["Thursday","もくようび"],["Friday","きんようび"],
  ["spring","はる"],["summer","なつ"],["fall","あき"],["winter","ふゆ"],["morning","あさ"],
  ["night","よる"],["today","きょう"],["run","はしる"],["walk","あるく"],["jump","とぶ"],
  ["eat","たべる"],["drink","のむ"],["read","よむ"],["write","かく"],["play","あそぶ"],
  ["study","べんきょうする"],["sing","うたう"],["swim","およぐ"],["like","すき"],["want","ほしい"],
  ["go","いく"],["come","くる"]
];

const SENTENCES = [
  ["I am a student.","わたしは せいとです。"],
  ["This is my book.","これは わたしの ほんです。"],
  ["I like apples.","わたしは りんごが すきです。"],
  ["She is my friend.","かのじょは わたしの ともだちです。"],
  ["He plays soccer.","かれは サッカーを します。"],
  ["I have a dog.","わたしは いぬを かっています。"],
  ["Open your book.","ほんを ひらいて。"],
  ["What is this?","これは なに？"],
  ["How are you?","げんき？"],
  ["I am fine.","げんきです。"],
  ["Thank you very much.","どうも ありがとう。"],
  ["Nice to meet you.","はじめまして。"],
  ["I go to school.","わたしは がっこうへ いきます。"],
  ["We are good friends.","わたしたちは なかよしです。"],
  ["She has a cat.","かのじょは ねこを かっています。"],
  ["I can swim.","わたしは およげます。"],
  ["Do you like music?","おんがくは すき？"],
  ["Let's play together.","いっしょに あそぼう。"],
  ["It is a nice day.","いい てんきです。"],
  ["I get up at seven.","わたしは 7じに おきます。"],
  ["My name is Yuki.","わたしの なまえは ユキです。"],
  ["I like blue.","わたしは あおが すきです。"],
  ["This is a big dog.","これは おおきい いぬです。"],
  ["I study English.","わたしは えいごを べんきょうします。"],
  ["See you tomorrow.","また あした。"]
];

/* ===================== STATE ===================== */
const DAILY_GOAL = 10;
const DEFAULT = {
  total:0, correct:0, points:0, streak:0, bestStreak:0,
  lastDay:"", days:[], todayCount:0, todayDay:"",
  stars:{}, badges:[], grid:[]
};
let S = load();
let mode = "word";
let collMode = "word";
let current = null;        // {en, jp, key}
let answered = false;
let revealed = false;
let queue = [];

function load(){
  try{
    const raw = localStorage.getItem("dictation_v1");
    if(raw) return Object.assign({}, DEFAULT, JSON.parse(raw));
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ localStorage.setItem("dictation_v1", JSON.stringify(S)); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* ===================== SPEECH ===================== */
let voices = [];
let enVoice = null;
function pickVoice(){
  voices = speechSynthesis.getVoices();
  enVoice = voices.find(v=>/en[-_]US/i.test(v.lang) && /female|zira|samantha|natural|aria|jenny/i.test(v.name))
        || voices.find(v=>/en[-_]US/i.test(v.lang))
        || voices.find(v=>/^en/i.test(v.lang))
        || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speakCurrent(){
  if(!current) return;
  if(!('speechSynthesis' in window)){ toast("この ブラウザは おとが でないみたい…"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(current.en);
  u.lang = "en-US";
  u.rate = parseFloat(document.getElementById('speed').value); // 速度
  u.pitch = 1.0;   // ピッチは固定（高さを変えない）
  u.volume = 1.0;
  if(enVoice) u.voice = enVoice;
  const btn = document.getElementById('playBtn');
  u.onstart = ()=>btn.classList.add('speaking');
  u.onend = ()=>btn.classList.remove('speaking');
  u.onerror = ()=>btn.classList.remove('speaking');
  speechSynthesis.speak(u);
}

/* ===================== HELPERS ===================== */
function keyOf(item){ return (mode==="word"?"w:":"s:") + item[0]; }
function norm(s){ return s.trim().replace(/\s+/g," ").toLowerCase(); }

function pool(){ return mode==="word"?WORDS:SENTENCES; }

function pickQuestion(){
  const p = pool();
  // 優先復習：★が低い / 間違えた語を多めに
  const weighted = [];
  p.forEach((item)=>{
    const k = (mode==="word"?"w:":"s:")+item[0];
    const st = S.stars[k] || {lv:0, ok:0, ng:0};
    let w = 1;
    if(st.lv===0) w = 3;          // まだの語を優先
    else if(st.lv<3) w = 2;       // 苦手を優先
    if(st.ng>st.ok) w += 2;       // 間違いが多い語
    for(let i=0;i<w;i++) weighted.push(item);
  });
  let item = weighted[Math.floor(Math.random()*weighted.length)];
  // 直前と同じは避ける
  if(current && item[0]===current.en && weighted.length>1){
    item = weighted[Math.floor(Math.random()*weighted.length)];
  }
  return {en:item[0], jp:item[1], key:(mode==="word"?"w:":"s:")+item[0]};
}

/* ===================== RENDER PRACTICE ===================== */
function nextQuestion(){
  current = pickQuestion();
  answered = false; revealed = false;
  const ans = document.getElementById('answer');
  ans.value = ""; ans.disabled = false; ans.focus();
  document.getElementById('hintBox').textContent = "";
  document.getElementById('result').classList.add('hidden');
  document.getElementById('result').innerHTML = "";
  document.getElementById('checkBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('promptJp').textContent = mode==="word" ? "この えいごを きいて かこう！" : "この ぶんを きいて かこう！";
  setTimeout(speakCurrent, 250);
}

function hintCount(){
  if(!current) return;
  const letters = current.en.replace(/[^A-Za-z]/g,"").length;
  const words = current.en.trim().split(/\s+/).length;
  document.getElementById('hintBox').textContent =
    mode==="word" ? `${letters} もじ` : `${words} ご・${current.en.length} もじ`;
}
function hintFirst(){
  if(!current) return;
  document.getElementById('hintBox').textContent = "さいしょ → " + current.en[0].toUpperCase();
}
function showAnswer(){
  if(!current) return;
  revealed = true;
  document.getElementById('hintBox').innerHTML = "こたえ → <b style='color:var(--brand-d)'>"+escapeHtml(current.en)+"</b>　（うつして かいてみよう）";
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 文字ごとの色分け diff */
function ch(c){ return c===" " ? "&nbsp;" : escapeHtml(c); }
function diffHtml(user, ans){
  const u = user, a = ans;
  let out = "";
  const len = Math.max(u.length, a.length);
  for(let i=0;i<len;i++){
    const ac = a[i], uc = u[i];
    if(uc===undefined){
      out += `<span class="c-miss">${ch(ac||"")}</span>`;
    }else if(ac===undefined){
      out += `<span class="c-ng">${ch(uc)}</span>`;
    }else if(uc.toLowerCase()===ac.toLowerCase()){
      out += `<span class="c-ok">${ch(uc)}</span>`;
    }else{
      out += `<span class="c-ng">${ch(uc)}</span>`;
    }
  }
  return out;
}

function checkAnswer(){
  if(!current || answered) return;
  const user = document.getElementById('answer').value;
  const ok = norm(user) === norm(current.en);
  answered = true;
  document.getElementById('answer').disabled = true;
  document.getElementById('checkBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');

  recordResult(ok, revealed);

  const st = S.stars[current.key] || {lv:0,ok:0,ng:0};
  const res = document.getElementById('result');
  res.classList.remove('hidden');
  let html = "";
  if(ok){
    html += `<div class="verdict ok">⭕ せいかい！</div>`;
  }else{
    html += `<div class="verdict ng">△ おしい！もういちど みてみよう</div>`;
    html += `<div class="diff">${diffHtml(user||" ", current.en)}</div>`;
  }
  html += `<div class="correct-line">こたえ：<b>${escapeHtml(current.en)}</b></div>`;
  html += `<div class="meaning">${escapeHtml(current.jp)}</div>`;
  html += `<div class="stars">${"★".repeat(st.lv)}${"☆".repeat(5-st.lv)}</div>`;
  res.innerHTML = html;

  if(ok){ confetti(); }
  refreshHeader();
}

/* ===================== RECORD / STATS ===================== */
function recordResult(ok, wasRevealed){
  const t = today();
  // 学習日
  if(S.todayDay !== t){ S.todayDay = t; S.todayCount = 0; }
  if(!S.days.includes(t)) S.days.push(t);

  // streak
  updateStreak(t);

  S.total++;
  S.todayCount++;
  // 正解（こたえを見て写しただけはノーカウントにしない＝正解扱いしない）
  const realCorrect = ok && !wasRevealed;
  if(realCorrect) S.correct++;

  // points
  if(realCorrect){ S.points += 10; popPoints("+10"); }
  else if(ok){ S.points += 3; }

  // stars
  const st = S.stars[current.key] || {lv:0, ok:0, ng:0};
  if(realCorrect){ st.ok++; st.lv = Math.min(5, st.lv+1); }
  else if(!ok){ st.ng++; st.lv = Math.max(0, st.lv-1); }
  S.stars[current.key] = st;

  // grid (1問1マス, 上限400)
  if(S.grid.length < 400) S.grid.push(st.lv);
  else { S.grid.shift(); S.grid.push(st.lv); }

  checkBadges();
  save();
  renderGoal();
}

function updateStreak(t){
  if(S.lastDay === t) return; // 同日は据え置き
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  if(S.lastDay === yStr) S.streak++;
  else S.streak = 1;
  S.lastDay = t;
  if(S.streak > S.bestStreak) S.bestStreak = S.streak;
}

/* ===================== BADGES ===================== */
const BADGE_DEFS = [
  {id:"first", ico:"🌱", name:"はじめの一歩", test:s=>s.total>=1},
  {id:"ten", ico:"🔟", name:"10もん", test:s=>s.total>=10},
  {id:"fifty", ico:"5️⃣0️⃣", name:"50もん", test:s=>s.total>=50},
  {id:"hundred",ico:"💯", name:"100もん", test:s=>s.total>=100},
  {id:"streak3",ico:"🔥", name:"3日れんぞく", test:s=>s.bestStreak>=3},
  {id:"streak7",ico:"⚡", name:"1しゅうかん", test:s=>s.bestStreak>=7},
  {id:"acc90",  ico:"🎯", name:"せいかい90%", test:s=>s.total>=20 && s.correct/s.total>=0.9},
  {id:"master5",ico:"👑", name:"★5を5こ", test:s=>Object.values(s.stars).filter(x=>x.lv>=5).length>=5},
  {id:"pts500", ico:"💎", name:"500ポイント", test:s=>s.points>=500},
];
function checkBadges(){
  BADGE_DEFS.forEach(b=>{
    if(!S.badges.includes(b.id) && b.test(S)){
      S.badges.push(b.id);
      toast(`🏅 バッジ ゲット！「${b.name}」`);
    }
  });
}

/* ===================== UI: GOAL / HEADER ===================== */
function renderGoal(){
  const c = S.todayDay===today() ? S.todayCount : 0;
  const pct = Math.min(100, Math.round(c/DAILY_GOAL*100));
  document.getElementById('goalBar').style.width = pct+"%";
  document.getElementById('goalTxt').textContent = `${c} / ${DAILY_GOAL}`;
  if(c===DAILY_GOAL){ toast("🎉 きょうの もくひょう たっせい！"); }
}
function refreshHeader(){
  document.getElementById('streakNum').textContent = S.lastDay===today()? S.streak : (S.streak||0);
}

/* ===================== COLLECTION VIEW ===================== */
function renderCollection(){
  document.getElementById('stTotal').textContent = S.total;
  document.getElementById('stAcc').textContent = (S.total? Math.round(S.correct/S.total*100):0)+"%";
  document.getElementById('stDays').textContent = S.days.length;
  document.getElementById('stPts').textContent = S.points;
  document.getElementById('stStreak').textContent = S.lastDay===today()? S.streak : S.streak;
  document.getElementById('stBest').textContent = S.bestStreak;

  // badges
  const bc = document.getElementById('badges');
  bc.innerHTML = BADGE_DEFS.map(b=>{
    const got = S.badges.includes(b.id);
    return `<div class="badge ${got?'got':''}"><div class="ico">${b.ico}</div><div class="bn">${b.name}</div></div>`;
  }).join("");

  // dot grid
  const g = document.getElementById('dotGrid');
  let dots = S.grid.slice(-200);
  while(dots.length < 60) dots.push(-1); // 最低60マス
  g.innerHTML = dots.map(lv=> lv<0 ? `<div class="dot"></div>` : `<div class="dot l${lv}"></div>`).join("");

  renderCollectList();
}

function renderCollectList(){
  const list = collMode==="word"?WORDS:SENTENCES;
  const prefix = collMode==="word"?"w:":"s:";
  let mastered=0;
  const html = list.map(item=>{
    const k = prefix+item[0];
    const st = S.stars[k] || {lv:0};
    if(st.lv>=5) mastered++;
    const stars = "★".repeat(st.lv)+"☆".repeat(5-st.lv);
    return `<div class="word-card ${st.lv===0?'new':''}">
      <div class="w">${escapeHtml(item[0])}</div>
      <div class="m">${escapeHtml(item[1])}</div>
      <div class="s">${stars}</div></div>`;
  }).join("");
  document.getElementById('collectList').innerHTML = html;
  document.getElementById('collProg').textContent = `（マスター ${mastered} / ${list.length}）`;
}

/* ===================== UI CONTROLS ===================== */
function showTab(t){
  document.getElementById('tabPractice').classList.toggle('on', t==='practice');
  document.getElementById('tabCollect').classList.toggle('on', t==='collect');
  document.getElementById('view-practice').classList.toggle('hidden', t!=='practice');
  document.getElementById('view-collect').classList.toggle('hidden', t!=='collect');
  if(t==='collect') renderCollection();
}
function setMode(m){
  mode=m;
  document.getElementById('modeWord').classList.toggle('on', m==='word');
  document.getElementById('modeSent').classList.toggle('on', m==='sentence');
  nextQuestion();
}
function setCollMode(m){
  collMode=m;
  document.getElementById('cwWord').classList.toggle('on', m==='word');
  document.getElementById('cwSent').classList.toggle('on', m==='sentence');
  renderCollectList();
}
function resetAll(){
  if(confirm("ぜんぶの きろくを けします。よろしいですか？")){
    localStorage.removeItem("dictation_v1");
    S = JSON.parse(JSON.stringify(DEFAULT));
    save(); renderCollection(); refreshHeader(); renderGoal();
    toast("きろくを リセットしました");
  }
}

/* ===================== EFFECTS ===================== */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function popPoints(txt){
  const el=document.createElement('div');
  el.className='pop'; el.textContent=txt;
  el.style.left=(window.innerWidth/2-10)+"px";
  el.style.top=(window.innerHeight/2)+"px";
  el.style.color="#ffb020";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function confetti(){
  const emojis=["🎉","✨","⭐","🌟","💫"];
  for(let i=0;i<8;i++){
    const el=document.createElement('div');
    el.className='pop'; el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=(Math.random()*window.innerWidth)+"px";
    el.style.top=(window.innerHeight*0.4+Math.random()*80)+"px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1000);
  }
}

/* ===================== SPEED LABEL ===================== */
document.getElementById('speed').addEventListener('input',e=>{
  const v=parseFloat(e.target.value);
  let label = v<0.8?"ゆっくり":v>1.05?"はやい":"ふつう";
  document.getElementById('speedVal').textContent = `${label} (${v.toFixed(2)}x)`;
});
/* Enterで こたえあわせ / つぎへ */
document.getElementById('answer').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); if(!answered) checkAnswer(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && answered && !document.getElementById('nextBtn').classList.contains('hidden')){
    nextQuestion();
  }
});

/* ===================== INIT ===================== */
refreshHeader();
renderGoal();
nextQuestion();
</script>
