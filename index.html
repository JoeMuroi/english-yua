<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>毎日ディクテーション</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7faf8;
      --panel: #ffffff;
      --ink: #203127;
      --muted: #66766d;
      --line: #dce7df;
      --green: #2f8f5b;
      --green-dark: #246e46;
      --yellow: #f2b94b;
      --red: #d9534f;
      --blue: #3f7fc4;
      --soft-green: #e7f5ec;
      --soft-yellow: #fff5db;
      --shadow: 0 10px 26px rgba(32, 49, 39, .09);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      color: var(--ink);
      background: #edf4ef;
      transition: transform .08s ease, background .18s ease, opacity .18s ease;
    }

    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .48; }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.35rem);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .top-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(82px, 1fr));
      gap: 8px;
      min-width: min(520px, 100%);
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .82rem;
      margin-top: 2px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(310px, .85fr);
      gap: 16px;
      align-items: start;
    }

    section, aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .practice {
      padding: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      background: #edf4ef;
      padding: 4px;
      border-radius: 8px;
    }

    .segmented button {
      padding: 9px 13px;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: #fff;
      color: var(--green-dark);
      box-shadow: 0 2px 8px rgba(32, 49, 39, .1);
    }

    .goal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .92rem;
    }

    .goal-row input {
      width: 64px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .question-area {
      background: linear-gradient(180deg, #f2fbf5, #fff);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .prompt-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: .86rem;
    }

    .listen-row {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .primary {
      background: var(--green);
      color: #fff;
      font-weight: 700;
    }

    .primary:hover { background: var(--green-dark); }

    .danger {
      background: #fff0ef;
      color: #a43532;
    }

    .answer-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      padding: 14px;
      border: 2px solid #cfe0d5;
      border-radius: 8px;
      font-size: 1.18rem;
      line-height: 1.6;
      color: var(--ink);
      background: #fff;
    }

    .answer-input:focus {
      outline: 3px solid rgba(47, 143, 91, .16);
      border-color: var(--green);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 13px 0 0;
    }

    .feedback {
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      min-height: 78px;
    }

    .feedback h2 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .answer-line {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      line-height: 1.9;
      word-break: break-word;
      font-size: 1.04rem;
    }

    .match { color: var(--green-dark); background: #e4f6ea; }
    .miss { color: #b12d29; background: #ffe8e6; text-decoration: underline; }
    .extra { color: #7a4b00; background: #fff0c2; text-decoration: line-through; }
    .blank { color: #8d99a0; background: #eef2f3; }

    .answer-line span {
      display: inline-block;
      min-width: .62em;
      padding: 0 2px;
      border-radius: 4px;
      margin: 1px;
    }

    .hint-box {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.7;
    }

    .copy-box {
      margin-top: 12px;
      display: none;
    }

    .copy-box.active { display: block; }

    .copy-answer {
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--green);
      background: var(--soft-green);
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .side {
      display: grid;
      gap: 12px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .panel {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }

    .bar {
      height: 12px;
      background: #edf4ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green), var(--yellow));
      border-radius: inherit;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbf9;
      color: var(--muted);
      font-size: .86rem;
    }

    .badge.on {
      border-color: #e0a51d;
      background: var(--soft-yellow);
      color: #694700;
      font-weight: 700;
    }

    .grid-tools {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: .88rem;
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11px, 1fr));
      gap: 5px;
      max-height: 144px;
      overflow: auto;
      padding-right: 2px;
    }

    .dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #e4ece7;
      border: 1px solid #d7e2db;
    }

    .dot.ok { background: var(--green); border-color: var(--green); }
    .dot.no { background: var(--red); border-color: var(--red); }

    .collection-list {
      display: grid;
      gap: 7px;
      max-height: 280px;
      overflow: auto;
      padding-right: 2px;
    }

    .word-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfb;
    }

    .word-row b {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .word-row small {
      color: var(--muted);
    }

    .stars {
      color: #d79a16;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .foot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--green);
    }

    .voice-note {
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.6;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      header, main {
        grid-template-columns: 1fr;
      }
      .top-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .listen-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 18px, 1180px); padding-top: 12px; }
      .practice, .panel, .question-area { padding: 12px; }
      .top-stats { grid-template-columns: 1fr 1fr; }
      .toolbar { align-items: stretch; }
      .segmented { width: 100%; }
      .segmented button { width: 100%; }
      .actions button { flex: 1 1 130px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>毎日ディクテーション</h1>
        <p class="subtitle">聞く、書く、見直す。やった分がちゃんとたまる中1英語練習。</p>
      </div>
      <div class="top-stats" aria-label="学習記録">
        <div class="stat"><strong id="totalCount">0</strong><span>のべ問題数</span></div>
        <div class="stat"><strong id="accuracy">0%</strong><span>正解率</span></div>
        <div class="stat"><strong id="studyDays">0</strong><span>学習日数</span></div>
        <div class="stat"><strong id="streak">0</strong><span>連続日数</span></div>
      </div>
    </header>

    <main>
      <section class="practice">
        <div class="toolbar">
          <div class="segmented" aria-label="練習モード">
            <button id="wordMode" class="active" type="button">単語</button>
            <button id="sentenceMode" type="button">短文</button>
          </div>
          <label class="goal-row">今日の目標
            <input id="dailyGoal" type="number" min="1" max="80" step="1">
            問
          </label>
        </div>

        <div class="question-area">
          <div class="prompt-meta">
            <span class="pill" id="modePill">単語モード</span>
            <span class="pill" id="priorityPill">優先復習あり</span>
            <span class="pill" id="levelPill">★☆☆☆☆</span>
          </div>

          <div class="listen-row">
            <button id="listenBtn" class="primary" type="button">🔊 きく</button>
            <label>速度 <span id="rateLabel">0.85</span>
              <input id="rate" type="range" min="0.5" max="1.25" value="0.85" step="0.05">
            </label>
            <button id="repeatSlowBtn" type="button">もう一度</button>
          </div>

          <textarea id="answerInput" class="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="聞こえた英語をここに入力"></textarea>

          <div class="actions">
            <button id="checkBtn" class="primary" type="button">こたえあわせ</button>
            <button id="hintBtn" type="button">ヒント</button>
            <button id="showBtn" type="button">こたえを見る</button>
            <button id="nextBtn" type="button" disabled>つぎへ</button>
          </div>

          <div id="feedback" class="feedback" aria-live="polite">
            <h2>準備OK</h2>
            <div>「きく」を押して、聞こえたまま書いてみよう。</div>
          </div>

          <div id="copyBox" class="copy-box">
            <div id="copyAnswer" class="copy-answer"></div>
            <textarea id="copyPractice" class="answer-input" rows="2" spellcheck="false" placeholder="ここに写して練習"></textarea>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="panel">
          <h2>今日の進み具合</h2>
          <div class="progress-wrap">
            <div><b id="todayDone">0</b> / <span id="goalText">10</span> 問 <span id="pointText">0 pt</span></div>
            <div class="bar"><i id="goalBar"></i></div>
          </div>
          <div class="badges" id="badges"></div>
        </div>

        <div class="panel">
          <h2>やった分ドット</h2>
          <div class="grid-tools">
            <span>直近120問</span>
            <span>緑=正解 / 赤=復習</span>
          </div>
          <div id="dotGrid" class="dot-grid"></div>
        </div>

        <div class="panel">
          <h2>コレクション</h2>
          <div class="grid-tools">
            <span id="collectionSummary">0語</span>
            <button id="reviewBtn" type="button">間違い優先</button>
          </div>
          <div id="collection" class="collection-list"></div>
          <p class="voice-note">音声はブラウザ内蔵の英語音声を使います。初回だけ音声一覧の読み込みに数秒かかることがあります。</p>
          <div class="foot-actions">
            <button id="resetSessionBtn" type="button">今日の入力をクリア</button>
            <button id="resetAllBtn" class="danger" type="button">記録をリセット</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const WORDS = [
      "apple","bag","ball","bike","book","box","bus","cake","cat","chair",
      "class","clock","computer","cup","desk","dog","door","egg","family","father",
      "fish","friend","girl","guitar","hat","home","house","key","kitchen","letter",
      "library","map","milk","mother","name","notebook","orange","park","pen","pencil",
      "picture","school","sister","soccer","student","teacher","tennis","train","tree","window",
      "breakfast","lunch","dinner","morning","afternoon","evening","Sunday","Monday","Tuesday","Wednesday",
      "Thursday","Friday","Saturday","January","February","March","April","May","June","July",
      "August","September","October","November","December","beautiful","favorite","interesting","happy","hungry",
      "small","large","new","old","good","nice","blue","green","white","yellow"
    ];

    const SENTENCES = [
      "I am a student.",
      "You are my friend.",
      "This is my book.",
      "That is your bag.",
      "I like English.",
      "I play soccer.",
      "She plays tennis.",
      "He has a dog.",
      "Do you like music?",
      "Yes, I do.",
      "No, I do not.",
      "What is this?",
      "It is a pen.",
      "Where is my notebook?",
      "It is on the desk.",
      "I go to school by bus.",
      "My father is a teacher.",
      "My mother cooks dinner.",
      "I have two sisters.",
      "Can you swim?",
      "I can play the guitar.",
      "Open the window, please.",
      "What time is it?",
      "It is seven thirty.",
      "See you tomorrow."
    ];

    const STORE_KEY = "dailyDictationJuniorHigh.v1";
    const todayKey = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    const defaultState = () => ({
      mode: "word",
      dailyGoal: 10,
      points: 0,
      items: {},
      attempts: [],
      days: {},
      lastStudyDate: null,
      streak: 0
    });

    let state = loadState();
    let current = null;
    let checked = false;
    let reviewOnly = false;
    let voices = [];

    const $ = (id) => document.getElementById(id);
    const els = {
      wordMode: $("wordMode"),
      sentenceMode: $("sentenceMode"),
      modePill: $("modePill"),
      priorityPill: $("priorityPill"),
      levelPill: $("levelPill"),
      listenBtn: $("listenBtn"),
      repeatSlowBtn: $("repeatSlowBtn"),
      rate: $("rate"),
      rateLabel: $("rateLabel"),
      answerInput: $("answerInput"),
      checkBtn: $("checkBtn"),
      hintBtn: $("hintBtn"),
      showBtn: $("showBtn"),
      nextBtn: $("nextBtn"),
      feedback: $("feedback"),
      copyBox: $("copyBox"),
      copyAnswer: $("copyAnswer"),
      copyPractice: $("copyPractice"),
      totalCount: $("totalCount"),
      accuracy: $("accuracy"),
      studyDays: $("studyDays"),
      streak: $("streak"),
      dailyGoal: $("dailyGoal"),
      todayDone: $("todayDone"),
      goalText: $("goalText"),
      goalBar: $("goalBar"),
      pointText: $("pointText"),
      badges: $("badges"),
      dotGrid: $("dotGrid"),
      collection: $("collection"),
      collectionSummary: $("collectionSummary"),
      reviewBtn: $("reviewBtn"),
      resetSessionBtn: $("resetSessionBtn"),
      resetAllBtn: $("resetAllBtn")
    };

    function loadState() {
      try {
        return { ...defaultState(), ...JSON.parse(localStorage.getItem(STORE_KEY) || "{}") };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    function allItems(mode = state.mode) {
      const source = mode === "word" ? WORDS : SENTENCES;
      return source.map((text, index) => ({ id: `${mode}:${text.toLowerCase()}`, text, mode, index }));
    }

    function statsFor(id) {
      if (!state.items[id]) state.items[id] = { seen: 0, correct: 0, wrong: 0, streak: 0, last: null };
      return state.items[id];
    }

    function levelFor(itemStats) {
      const score = Math.max(0, itemStats.correct * 2 + itemStats.streak - itemStats.wrong);
      return Math.max(1, Math.min(5, Math.floor(score / 3) + 1));
    }

    function stars(level) {
      return "★★★★★".slice(0, level) + "☆☆☆☆☆".slice(0, 5 - level);
    }

    function chooseNext() {
      const items = allItems();
      const weighted = [];
      for (const item of items) {
        const s = statsFor(item.id);
        const base = 2;
        const wrongBoost = s.wrong > 0 ? 5 + Math.min(8, s.wrong * 2) : 0;
        const newBoost = s.seen === 0 ? 7 : 0;
        const weakBoost = s.correct < 2 ? 3 : 0;
        const reviewBoost = reviewOnly && s.wrong > 0 ? 12 : 0;
        const weight = reviewOnly && s.wrong === 0 ? 0 : base + wrongBoost + newBoost + weakBoost + reviewBoost;
        for (let i = 0; i < weight; i++) weighted.push(item);
      }
      current = weighted[Math.floor(Math.random() * weighted.length)] || items[Math.floor(Math.random() * items.length)];
      checked = false;
      els.answerInput.value = "";
      els.answerInput.disabled = false;
      els.copyPractice.value = "";
      els.copyBox.classList.remove("active");
      els.nextBtn.disabled = true;
      els.checkBtn.disabled = false;
      renderPrompt();
      setFeedback("準備OK", "「きく」を押して、聞こえたまま書いてみよう。");
      window.setTimeout(() => speak(current.text), 250);
    }

    function normalize(text) {
      return text
        .trim()
        .replace(/[’‘]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function compare(expected, actual) {
      const exp = normalize(expected);
      const ans = normalize(actual);
      const max = Math.max(exp.length, ans.length);
      const parts = [];
      let mismatches = 0;
      for (let i = 0; i < max; i++) {
        const e = exp[i] || "";
        const a = ans[i] || "";
        if (e && a && e === a) parts.push(`<span class="match">${escapeHtml(a)}</span>`);
        else if (e && a) {
          mismatches++;
          parts.push(`<span class="miss" title="正しくは ${escapeHtml(e)}">${escapeHtml(a)}</span>`);
        } else if (e && !a) {
          mismatches++;
          parts.push(`<span class="blank" title="足りない文字">${e === " " ? "·" : "_"}</span>`);
        } else {
          mismatches++;
          parts.push(`<span class="extra" title="多い文字">${escapeHtml(a)}</span>`);
        }
      }
      return { ok: exp === ans, html: parts.join(""), mismatches };
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    function checkAnswer() {
      if (checked || !current) return;
      const result = compare(current.text, els.answerInput.value);
      const itemStats = statsFor(current.id);
      itemStats.seen++;
      itemStats.last = new Date().toISOString();

      if (result.ok) {
        itemStats.correct++;
        itemStats.streak++;
        state.points += current.mode === "word" ? 10 : 16;
      } else {
        itemStats.wrong++;
        itemStats.streak = 0;
        state.points += 2;
      }

      const day = todayKey();
      if (!state.days[day]) state.days[day] = { total: 0, correct: 0 };
      state.days[day].total++;
      if (result.ok) state.days[day].correct++;
      updateStreak(day);

      state.attempts.push({ date: new Date().toISOString(), id: current.id, text: current.text, ok: result.ok });
      state.attempts = state.attempts.slice(-500);
      checked = true;
      els.answerInput.disabled = true;
      els.checkBtn.disabled = true;
      els.nextBtn.disabled = false;

      const title = result.ok ? "正解！" : "あと少し";
      const body = result.ok
        ? `よく聞けています。${current.mode === "word" ? "10" : "16"}ポイント追加。`
        : `<div>赤は違う文字、灰色は足りない文字、黄色は多い文字です。</div>
           <div class="answer-line">${result.html}</div>
           <div class="hint-box">正解: <b>${escapeHtml(current.text)}</b></div>`;
      setFeedback(title, body);
      saveState();
      renderAll();
    }

    function updateStreak(day) {
      const days = Object.keys(state.days).sort();
      let streak = 0;
      let cursor = new Date(day + "T00:00:00");
      while (true) {
        const key = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
        if (!state.days[key] || state.days[key].total < 1) break;
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      state.lastStudyDate = day;
      state.streak = streak;
    }

    function showHint() {
      if (!current) return;
      const text = current.text;
      const first = text[0];
      const letters = text.replace(/\s/g, "").length;
      const words = text.split(/\s+/).length;
      setFeedback("ヒント", current.mode === "word"
        ? `文字数は <b>${letters}</b>、最初の文字は <b>${escapeHtml(first)}</b> です。`
        : `単語数は <b>${words}</b>、スペースを除いた文字数は <b>${letters}</b>、最初の文字は <b>${escapeHtml(first)}</b> です。`);
    }

    function showAnswer() {
      if (!current) return;
      els.copyAnswer.textContent = current.text;
      els.copyBox.classList.add("active");
      setFeedback("写し練習", "答えを見ながら、下の欄に一度写してから「つぎへ」。");
      els.nextBtn.disabled = false;
    }

    function setFeedback(title, body) {
      els.feedback.innerHTML = `<h2>${title}</h2><div>${body}</div>`;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        setFeedback("音声が使えません", "このブラウザでは音声読み上げに対応していません。ChromeまたはEdgeで開いてください。");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = Number(els.rate.value);
      utterance.pitch = 1;
      const voice = pickVoice();
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    function pickVoice() {
      voices = window.speechSynthesis.getVoices();
      return voices.find(v => /en-US/i.test(v.lang) && /natural|online|aria|jenny|guy|zira|samantha/i.test(v.name))
        || voices.find(v => /en-US/i.test(v.lang))
        || voices.find(v => /^en/i.test(v.lang))
        || null;
    }

    function renderPrompt() {
      const s = statsFor(current.id);
      els.modePill.textContent = current.mode === "word" ? "単語モード" : "短文モード";
      els.priorityPill.textContent = s.wrong > 0 ? "優先復習対象" : "新規/定着";
      els.levelPill.textContent = stars(levelFor(s));
    }

    function renderAll() {
      const attempts = state.attempts;
      const total = attempts.length;
      const correct = attempts.filter(a => a.ok).length;
      const day = todayKey();
      const today = state.days[day] || { total: 0, correct: 0 };
      const goal = Number(state.dailyGoal) || 10;
      els.totalCount.textContent = total;
      els.accuracy.textContent = total ? `${Math.round(correct / total * 100)}%` : "0%";
      els.studyDays.textContent = Object.keys(state.days).filter(k => state.days[k].total > 0).length;
      els.streak.textContent = state.streak || 0;
      els.dailyGoal.value = goal;
      els.todayDone.textContent = today.total;
      els.goalText.textContent = goal;
      els.goalBar.style.width = `${Math.min(100, today.total / goal * 100)}%`;
      els.pointText.textContent = `${state.points || 0} pt`;
      els.rateLabel.textContent = Number(els.rate.value).toFixed(2);
      renderBadges(total, correct, today.total);
      renderDots();
      renderCollection();
    }

    function renderBadges(total, correct, todayTotal) {
      const badgeDefs = [
        ["first", total >= 1, "はじめの1問"],
        ["goal", todayTotal >= state.dailyGoal, "今日の目標達成"],
        ["streak3", state.streak >= 3, "3日連続"],
        ["streak7", state.streak >= 7, "7日連続"],
        ["hundred", total >= 100, "100問練習"],
        ["accuracy", total >= 20 && correct / total >= .8, "正解率80%"]
      ];
      els.badges.innerHTML = badgeDefs.map(([, on, label]) =>
        `<span class="badge ${on ? "on" : ""}">${label}</span>`
      ).join("");
    }

    function renderDots() {
      const recent = state.attempts.slice(-120);
      els.dotGrid.innerHTML = recent.map(a => `<span class="dot ${a.ok ? "ok" : "no"}" title="${escapeHtml(a.text)}"></span>`).join("")
        || Array.from({ length: 40 }, () => `<span class="dot"></span>`).join("");
    }

    function renderCollection() {
      const items = allItems("word").concat(allItems("sentence"));
      const seen = items
        .map(item => ({ item, s: statsFor(item.id) }))
        .filter(x => x.s.seen > 0)
        .sort((a, b) => (b.s.wrong - a.s.wrong) || (b.s.seen - a.s.seen));
      els.collectionSummary.textContent = `${seen.length}件 / ${items.length}件`;
      els.collection.innerHTML = seen.slice(0, 80).map(({ item, s }) => {
        const rate = s.seen ? Math.round(s.correct / s.seen * 100) : 0;
        return `<div class="word-row">
          <div><b>${escapeHtml(item.text)}</b><small>${s.seen}回・正解率${rate}%・ミス${s.wrong}</small></div>
          <span class="stars">${stars(levelFor(s))}</span>
        </div>`;
      }).join("") || `<div class="word-row"><div><b>まだ記録はありません</b><small>1問解くとここに増えます</small></div><span class="stars">☆☆☆☆☆</span></div>`;
    }

    function setMode(mode) {
      state.mode = mode;
      reviewOnly = false;
      els.wordMode.classList.toggle("active", mode === "word");
      els.sentenceMode.classList.toggle("active", mode === "sentence");
      saveState();
      chooseNext();
      renderAll();
    }

    els.wordMode.addEventListener("click", () => setMode("word"));
    els.sentenceMode.addEventListener("click", () => setMode("sentence"));
    els.listenBtn.addEventListener("click", () => current && speak(current.text));
    els.repeatSlowBtn.addEventListener("click", () => current && speak(current.text));
    els.rate.addEventListener("input", renderAll);
    els.checkBtn.addEventListener("click", checkAnswer);
    els.hintBtn.addEventListener("click", showHint);
    els.showBtn.addEventListener("click", showAnswer);
    els.nextBtn.addEventListener("click", chooseNext);
    els.reviewBtn.addEventListener("click", () => {
      reviewOnly = !reviewOnly;
      els.reviewBtn.textContent = reviewOnly ? "通常にもどす" : "間違い優先";
      chooseNext();
    });
    els.dailyGoal.addEventListener("change", () => {
      state.dailyGoal = Math.max(1, Math.min(80, Number(els.dailyGoal.value) || 10));
      saveState();
      renderAll();
    });
    els.resetSessionBtn.addEventListener("click", () => {
      els.answerInput.value = "";
      els.copyPractice.value = "";
      els.answerInput.disabled = false;
      setFeedback("入力をクリアしました", "もう一度聞いて書いてみよう。");
    });
    els.resetAllBtn.addEventListener("click", () => {
      if (!confirm("学習記録をすべてリセットしますか？")) return;
      state = defaultState();
      saveState();
      setMode("word");
    });
    els.answerInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") checkAnswer();
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        voices = window.speechSynthesis.getVoices();
      };
      voices = window.speechSynthesis.getVoices();
    }

    els.wordMode.classList.toggle("active", state.mode === "word");
    els.sentenceMode.classList.toggle("active", state.mode === "sentence");
    chooseNext();
    renderAll();
  </script>
</body>
</html>
